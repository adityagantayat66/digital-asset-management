worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 10M;

    # 1. Rate Limiting Zones (Leaky Bucket per Client IP)
    # General API Zone: 10 requests/sec per IP with 10MB memory allocation
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upload & Sensitive Endpoints Zone: 2 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    # Return standard HTTP 429 Too Many Requests when rate limits are breached
    limit_req_status 429;

    upstream dam-backend {
        server dam-backend:5000;
    }

    server {
        listen 8080;
        listen 8443 ssl;
        server_name localhost;
        # Path to SSL Certificate & Private Key inside the container
        ssl_certificate     /etc/nginx/ssl/localhost.pem;
        ssl_certificate_key /etc/nginx/ssl/localhost-key.pem;
        # Recommended TLS protocols & modern ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # Static React SPA
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;   
        }

        # Strict Upload URL Request Rate Limit (2 req/sec, max burst 5)
        location /api/assets/presigned-url {
            limit_req zone=upload_limit burst=5 nodelay;

            proxy_pass http://dam-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Gateway Rate Limit (10 req/sec, max burst 20)
        location /api {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://dam-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal Nginx authentication subrequest endpoint for storage protection
        location = /api/auth/verify-cookie {
            internal;
            proxy_pass http://dam-backend/api/auth/verify-cookie;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            client_max_body_size 5000M;
        }

        # Route MinIO S3 bucket requests (raw-assets & processed-assets) directly to MinIO
        location ~ ^/(raw-assets|processed-assets)/ {
            auth_request /api/auth/verify-cookie;

            proxy_pass http://minio:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 5000M;
        }
    }
}
