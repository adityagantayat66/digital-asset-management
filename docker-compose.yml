services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: dam-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dam_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dam_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Store & SSE PubSub
  redis:
    image: redis:alpine
    container_name: dam-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. RabbitMQ AMQP Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dam-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. MinIO S3 Object Storage Service
  minio:
    image: minio/minio:latest
    container_name: dam-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Backend API Gateway
  dam-backend:
    image: digital-access-management-dam-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dam-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: dam_super_secret_jwt_key_change_in_production
      JWT_EXPIRES_IN: 7d
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dam_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_RAW_BUCKET: raw-assets
      MINIO_PROCESSED_BUCKET: processed-assets
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio

  # 6. Stateless Background Worker Microservice
  worker:
    image: digital-access-management-worker:latest
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: always
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dam_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_RAW_BUCKET: raw-assets
      MINIO_PROCESSED_BUCKET: processed-assets
      WORKER_CONCURRENCY: 2
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
      - dam-backend

  # 7. Frontend Vite React Build Container (Copies dist to shared volume)
  frontend:
    image: digital-access-management-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/dist-target

  # 8. Nginx Reverse Proxy Container (Mounts shared volume read-only)
  nginx:
    image: digital-access-management-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - dam-backend

  # 9. System Logger Microservice
  logger:
    image: digital-access-management-logger:latest
    build:
      context: .
      dockerfile: logger/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    volumes:
      - ./Error-Logs:/app/logger/Error-Logs
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  frontend_dist:

    #docker compose build
    #docker stack deploy -c docker-compose.yml --resolve-image=never dam

